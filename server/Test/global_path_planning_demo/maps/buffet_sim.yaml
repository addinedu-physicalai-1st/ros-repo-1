# Real SLAM map from the pinky-pro Gazebo simulation / physical scan.
# The PGM is a copy of `device/pinky_pro_robot/map4.pgm` (the output
# of slam_toolbox on the actual buffet environment). Waypoints are
# hand-placed in the free cells of the pinky-pro inflated costmap.
#
# Map extent  : 40 x 32 px @ 0.05 m/px  =  2.00 x 1.60 m
# Origin      : ( -0.285, -1.241 ) in world coords
# World x     : [-0.285, +1.715]
# World y     : [-1.241, +0.359]
#
# Topology (after 0.09 m inflation for pinky-pro):
#
#   Vertical corridors:
#     - Left  (x ~ 0.00, col 5 ): continuous free r5 .. r26
#     - Mid   (x ~ 0.84, col 22): continuous free r8 .. r25
#     - Right (x ~ 1.50, col 35): continuous free r6 .. r26
#
#   Horizontal connectors:
#     - Top row  y = +0.05 (r25): left<->mid<->right (full width clear)
#     - Mid row  y = -0.566 (r13): mid<->right only (left is blocked by
#                                   the inner wall of the buffet station)
#     - Low row  y = -0.766 (r9): left<->mid only (right is blocked by
#                                   obstacles at cols 26..32)
#
# This gives 12 waypoints and 13 edges. Every pair of opposite corners
# has at least two topologically distinct paths (via the top corridor,
# or via the mid/low bridges through the middle column), so blocking a
# single waypoint or edge no longer disconnects the graph.

name: "Buffet SLAM map (map4)"

image: map4.pgm
mode: trinary
resolution: 0.05
origin: [-0.285, -1.241, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196

defaults:
  entry_radius: 0.35       # m; most free points are within reach of a column
  dynamic_radius: 0.12     # m; another pinky-pro + small margin
  inflation_radius: 0.09   # m; matches Nav2 inscribed + padding

waypoints:
  # ---- Left vertical corridor (x = 0.00, col 5) ----
  - {x: 0.00, y: -0.900, label: "Entrance"}
  - {x: 0.00, y: -0.766}                 # r9 bridge to middle column
  - {x: 0.00, y: -0.500}
  - {x: 0.00, y: -0.200}
  - {x: 0.00, y: +0.050, label: "Charging"}

  # ---- Middle vertical corridor (x = 0.84, col 22) ----
  # The cleanest vertical free strip inside the central obstacle band.
  - {x: 0.84, y: -0.766, label: "Table-S"}   # south service point
  - {x: 0.84, y: -0.566, label: "Table-N"}   # north service point
  - {x: 0.84, y: +0.050}                      # top corridor middle

  # ---- Right vertical corridor (x = 1.50, col 35) ----
  - {x: 1.50, y: -0.900, label: "Return"}
  - {x: 1.50, y: -0.566}                  # r13 bridge to middle column
  - {x: 1.50, y: -0.200}
  - {x: 1.50, y: +0.050, label: "Kitchen"}
