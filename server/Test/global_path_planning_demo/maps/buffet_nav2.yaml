# Nav2-format buffet test map (PGM occupancy + metadata),
# extended with the demo's `waypoints:` key. Nav2's
# map_server ignores unknown keys, so the same file can be
# served to both Nav2 and this demo without duplication.

name: "Buffet Nav2 raster"

# --- Nav2 map_server fields ---
image: buffet_nav2.pgm
mode: trinary
resolution: 0.05
origin: [-0.5, -0.5, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196

# Same large-scale map as buffet_default; override the pinky-pro-scaled
# module defaults to match.
defaults:
  entry_radius: 2.5
  dynamic_radius: 0.6
  inflation_radius: 0.0

# --- Demo extension: waypoints in world metres ---
waypoints:
  - {x: 1.0, y: 1.0, label: "CS-Left"}
  - {x: 4.0, y: 1.0, label: "A1-S"}
  - {x: 7.0, y: 1.0}
  - {x: 10.0, y: 1.0, label: "Entrance"}
  - {x: 13.0, y: 1.0}
  - {x: 15.0, y: 1.0, label: "A3-S"}
  - {x: 18.0, y: 1.0, label: "CS-Right"}
  - {x: 1.0, y: 6.0}
  - {x: 4.0, y: 6.0, label: "A1-N/B1-S"}
  - {x: 7.0, y: 6.0}
  - {x: 10.0, y: 6.0, label: "A2-N/B2-S"}
  - {x: 13.0, y: 6.0}
  - {x: 15.0, y: 6.0, label: "A3-N/B3-S"}
  - {x: 18.0, y: 6.0}
  - {x: 1.0, y: 10.0}
  - {x: 4.0, y: 10.0, label: "B1-N"}
  - {x: 7.0, y: 10.0}
  - {x: 10.0, y: 10.0, label: "B2-N"}
  - {x: 13.0, y: 10.0}
  - {x: 15.0, y: 10.0, label: "B3-N"}
  - {x: 18.0, y: 10.0}
  - {x: 1.0, y: 12.0}
  - {x: 4.0, y: 12.0, label: "Kitchen"}
  - {x: 7.0, y: 12.0}
  - {x: 13.0, y: 12.0}
  - {x: 15.0, y: 12.0, label: "Return"}
  - {x: 18.0, y: 12.0}
