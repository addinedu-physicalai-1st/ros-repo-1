# robot_function.yaml
#
# rostaurant_function 패키지 전체 노드의 파라미터 기본값.
# launch 파일에서 이 파일을 로드하며, 커맨드라인 인수로 덮어쓸 수 있음.
#
# 사용 예:
#   ros2 launch rostaurant_function robot_function.launch.py
#   ros2 launch rostaurant_function robot_function.launch.py config:=/path/to/custom.yaml

# ── 공통 ─────────────────────────────────────────────────────────────────────
# use_nav2 / simulated_nav_time 은 여러 노드가 공유하므로
# 각 노드 섹션에 동일하게 기재한다.

top_function_node:
  ros__parameters:
    use_nav2: false               # Nav2 사용 여부 (false: 시뮬)
    simulated_nav_time: 3.0       # 시뮬 내비게이션 도달 시간 (초)
    standby_pos_x: 0.0            # 대기장소 X 좌표 (m)
    standby_pos_y: 0.0            # 대기장소 Y 좌표 (m)
    standby_pos_theta: 0.0        # 대기장소 방향 (rad)
    charging_pos_x: 1.4          # 충전소 X 좌표 (m)
    charging_pos_y: 0.0          # 충전소 Y 좌표 (m)
    charging_pos_theta: 0.0       # 충전소 방향 (rad)

follow_function_node:
  ros__parameters:
    use_nav2: false
    simulated_nav_time: 3.0
    follow_time_limit: 60.0                   # 동행 최대 시간 (초)
    follow_table_distance_threshold: 1.5      # 테이블 근접 판정 거리 (m)
    test_follow_mode: true                    # 테스트: FSM 없이 즉시 following 시작

delivery_function_node:
  ros__parameters:
    use_nav2: false
    simulated_nav_time: 3.0

collect_function_node:
  ros__parameters:
    use_nav2: false
    simulated_nav_time: 3.0
    dishwash_pos_x: 0.0           # 설거지장 X 좌표 (m)
    dishwash_pos_y: 0.0           # 설거지장 Y 좌표 (m)
    dishwash_pos_theta: 0.0       # 설거지장 방향 (rad)
    max_collect_count: 3          # 설거지장 이동 임계 수거 횟수
    battery_low: 20.0             # 배터리 부족 임계값 (%). 이 값 미만 시 설거지장으로 이동

guide_function_node:
  ros__parameters:
    use_nav2: false
    simulated_nav_time: 3.0
