# robot_function_gz.yaml
#
# Gazebo 시뮬레이션 환경에서 rostaurant_function 노드를 실행할 때 사용하는 파라미터.
# use_nav2: true 로 설정하여 NavigationClient가 Nav2 navigate_to_pose 액션을 사용한다.
#
# 실행:
#   ros2 launch rostaurant_function robot_function.launch.py config:=$(ros2 pkg prefix rostaurant_function)/share/rostaurant_function/config/robot_function_gz.yaml

top_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
    standby_pos_x: 0.0
    standby_pos_y: 0.0
    standby_pos_theta: 0.0
    charging_pos_x: 1.4
    charging_pos_y: 0.0
    charging_pos_theta: 0.0

follow_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
    follow_time_limit: 60.0
    follow_table_distance_threshold: 1.5

delivery_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0

collect_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
    dishwash_pos_x: 0.0
    dishwash_pos_y: 0.0
    dishwash_pos_theta: 0.0
    max_collect_count: 5
    battery_low: 20.0

guide_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
