# config.yaml
#
# Rostaurant 시스템 전체 파라미터 통합 파일.
# rostaurant_state_machine, rostaurant_function, rostaurant_safety_layer
# 패키지의 모든 노드 파라미터를 한 곳에서 관리합니다.
#
# 설치 경로: share/rostaurant_state_machine/config/config.yaml
#
# 사용 예:
#   ros2 launch rostaurant_state_machine robot_bringup.launch.py
#   ros2 launch rostaurant_state_machine robot_bringup.launch.py config:=/abs/path/custom.yaml

# ════════════════════════════════════════════════════════════════════════════════
# rostaurant_state_machine
# ════════════════════════════════════════════════════════════════════════════════
robot_state_machine_node:
  ros__parameters:
    timeout_secs: 30.0          # VERIFY 상태 타임아웃 시간 (초)
    battery_low: 20.0           # 배터리 부족 임계값 (%). 이 값 미만이면 CHARGING_NO_TASK
    battery_mid: 60.0           # 배터리 중간 임계값 (%). 이 값 초과 시 CHARGING_WITH_TASK
    battery_high: 80.0          # 배터리 충분 임계값 (%). 이 값 초과 시 대기장소로 이동
    nav_delay: 60.0             # 내비게이션 시뮬 지연 (초) — use_function_nodes=false 일 때만 사용
    use_function_nodes: true    # true: rostaurant_function 패키지와 연동 (이벤트 기반 전이)
                                # false: 내부 타이머 시뮬레이션 (독립 실행)
    max_request_count: 3

# ════════════════════════════════════════════════════════════════════════════════
# rostaurant_function
# ════════════════════════════════════════════════════════════════════════════════
top_function_node:
  ros__parameters:
    use_nav2: true                # Nav2 사용 여부 (false: 시뮬)
    simulated_nav_time: 3.0       # 시뮬 내비게이션 도달 시간 (초)
    standby_pos_x: 0.0            # 대기장소 X 좌표 (m)
    standby_pos_y: 0.0            # 대기장소 Y 좌표 (m)
    standby_pos_theta: 0.0        # 대기장소 방향 (rad)
    charging_pos_x: 1.4           # 충전소 X 좌표 (m)
    charging_pos_y: 0.0           # 충전소 Y 좌표 (m)
    charging_pos_theta: 0.0       # 충전소 방향 (rad)

follow_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
    follow_time_limit: 60.0                   # 동행 최대 시간 (초)
    follow_table_distance_threshold: 1.5      # 테이블 근접 판정 거리 (m)

delivery_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0

collect_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0
    dishwash_pos_x: 0.0           # 설거지장 X 좌표 (m)
    dishwash_pos_y: 0.0           # 설거지장 Y 좌표 (m)
    dishwash_pos_theta: 0.0       # 설거지장 방향 (rad)
    max_collect_count: 3          # 설거지장 이동 임계 수거 횟수 (Gazebo: 5)
    battery_low: 20.0             # 배터리 부족 임계값 (%). 이 값 미만 시 설거지장으로 이동

guide_function_node:
  ros__parameters:
    use_nav2: true
    simulated_nav_time: 3.0

# ════════════════════════════════════════════════════════════════════════════════
# rostaurant_camera
# ════════════════════════════════════════════════════════════════════════════════
camera_node:
  ros__parameters:
    camera_index: 0               # VideoCapture 인덱스 (/dev/video0 → 0, /dev/video3 → 3)
    fps: 10.0                     # 퍼블리시 주기 (Hz)
    jpeg_quality: 90              # JPEG 압축 품질 (0–100). YOLO 성능을 위해 90 이상 권장

# ════════════════════════════════════════════════════════════════════════════════
# rostaurant_safety_layer
# ════════════════════════════════════════════════════════════════════════════════
child_detection_node:
  ros__parameters:
    # YOLO 모델
    yolo_model: best.pt           # 모델 파일 경로 (절대경로 권장)
    confidence: 0.5               # 감지 신뢰도 임계값 (0.0–1.0)
    child_class_names: [kid]      # 모델의 아이 클래스 레이블
    yolo_interval_sec: 0.2        # YOLO 추론 최소 간격 (초)

    # 3단계 구역 거리 임계값 (m)
    zone_stop: 0.3                # 이 거리 미만 → STOP
    zone_caution: 0.8             # 이 거리 미만 → CAUTION
    zone_monitor: 1.5             # 이 거리 미만 → MONITOR

    # LiDAR 탐색
    angle_window_deg: 8.0         # LiDAR 탐색 반폭 (±도)
    angle_offset_rad: 0.0         # 카메라-LiDAR 마운팅 보정 오프셋 (rad)

    # 카메라 내부 파라미터 (/camera/camera_info 없을 때 fallback)
    camera_fx: 0.0                # 초점거리 fx (px). 0이면 추론 차단됨
    camera_cx: 0.0                # 주점 cx (px). 보통 이미지 너비 / 2

    # 개발/디버그
    show_window: false            # OpenCV 감지 미리보기 창 표시 여부

safety_layer_node:
  ros__parameters:
    publish_rate_hz: 10.0         # 안전 로직 타이머 주기 (Hz)
    zone_timeout_s: 1.0           # child_safety_zone 토픽 타임아웃 (초)
    caution_speed_scale: 0.5      # CAUTION 구역 속도 감속 비율 (0.0–1.0)

event_recorder_node:
  ros__parameters:
    capture_rate_hz: 10.0         # 버퍼 저장 주기 (Hz)
    buffer_seconds: 60.0          # 롤링 버퍼 유지 시간 (초)
    output_dir: safety_events     # 이벤트 저장 루트 디렉터리 (절대경로 권장)
    jpeg_quality: 80              # JPEG 재압축 품질 (0–100)

buzzer_node:
  ros__parameters:
    buzzer_pin: 18                # BCM GPIO 핀 번호 (Raspberry Pi)
    beep_half_period_s: 0.3       # CAUTION 패턴 반주기 (초): ON→OFF 각각 이 시간
